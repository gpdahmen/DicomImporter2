name: Build Executable Releases

on:
  release:
    types: [created]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          pyinstaller --clean dicom_importer.spec
      
      - name: Create release artifact
        run: |
          cd dist
          move DicomImporter.exe DicomImporter-windows.exe
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: DicomImporter-windows
          path: dist/DicomImporter-windows.exe
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/DicomImporter-windows.exe
          asset_name: DicomImporter-windows.exe
          asset_content_type: application/octet-stream

  build-linux:
    name: Build Linux Executable
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          pyinstaller --clean dicom_importer.spec
      
      - name: Create release artifact
        run: |
          cd dist
          mv DicomImporter DicomImporter-linux
          chmod +x DicomImporter-linux
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: DicomImporter-linux
          path: dist/DicomImporter-linux
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/DicomImporter-linux
          asset_name: DicomImporter-linux
          asset_content_type: application/octet-stream

  build-macos:
    name: Build macOS Executable
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          pyinstaller --clean dicom_importer.spec
      
      - name: Create release artifact
        run: |
          cd dist
          mv DicomImporter DicomImporter-macos
          chmod +x DicomImporter-macos
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: DicomImporter-macos
          path: dist/DicomImporter-macos
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/DicomImporter-macos
          asset_name: DicomImporter-macos
          asset_content_type: application/octet-stream
